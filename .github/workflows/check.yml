name: Check games and Cloudflare remote controls
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Remove generated assets to check a fresh Cloudflare build
        run: node -e 'require("node:fs").rmSync("dist", { recursive: true, force: true })'
      - run: npm run check:deploy
      - run: npx playwright install --with-deps chromium
      - run: npm run test:remote
